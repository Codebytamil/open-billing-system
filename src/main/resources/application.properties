spring.application.name=billing-system
spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billing_db}
spring.datasource.username=${DB_USER:billing_user}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.error.include-message=always

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}